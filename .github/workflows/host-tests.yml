name: host-tests

on:
  push:
  pull_request:

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m py_compile scripts/*.py blender/*.py blender/core/*.py blender/jobs/*.py

  reference-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-reference.txt
      - run: python -m unittest discover -s tests -p "reference_regression_test.py"
