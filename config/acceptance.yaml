      role: hero
      primary: true
    - name: FrontReviewCamera
      role: front
      primary: false
    - name: SideReviewCamera
      role: side
      primary: false
  # TODO: Calibrate these against approved project renders before enabling them.
  ssim_min: null
  lpips_max: null
  semantic_similarity_min: null

iteration:
  max_iterations: 8
  require_structural_pass: true
