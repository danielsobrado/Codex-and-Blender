deterministic:
  min_width: 320
  min_height: 320
  min_luminance_stddev: 1.0
  max_dark_fraction: 0.995
  max_bright_fraction: 0.995
  dark_threshold: 4
  bright_threshold: 251

reference_regression:
  enabled: false
  mode: report_only
  views: []

model_review:
  enabled: true
  required: true
  # grok: Cursor/Codex console or a local CLI. codex: existing `codex exec` Astra path.
  # Neither provider uses HTTP APIs or API keys from this repository.
  provider: grok
  model: grok-4.6
  reasoning_effort: low
  prompt_file: prompts/visual_review.md
  output_schema_file: schemas/visual_evaluation.schema.json
