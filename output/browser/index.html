<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastal Jungle</title>
<style>
body{margin:0;background:#203d3c;color:#f5f1dd;font:14px system-ui;overflow:hidden}
canvas{display:block}
header{position:absolute;top:30px;left:32px;text-shadow:0 2px 15px #000}
h1{font:400 30px Georgia;margin:8px 0}
small{letter-spacing:3px;font-size:10px}
nav{position:absolute;bottom:28px;left:32px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{background:#122822bd;border:1px solid #b1bf9566;border-radius:5px;color:inherit;padding:10px 17px;cursor:pointer}
button:hover{background:#426246}
#status{position:absolute;bottom:30px;right:26px;font-size:12px;background:#122822aa;padding:10px;border-radius:5px}
#help{position:absolute;top:35px;right:30px;opacity:.8;font-size:12px}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#203d3ccc;z-index:20}
#loader.done{opacity:0;pointer-events:none;transition:opacity .35s ease}
.loader-card{width:min(420px,78vw);padding:28px 30px 24px;background:#122822e6;border:1px solid #b1bf9566;border-radius:10px;text-align:center;box-shadow:0 18px 50px #0008}
.loader-card p{margin:0 0 16px;letter-spacing:.04em}
.bar{height:10px;background:#0c1a16;border-radius:999px;overflow:hidden}
#loader-fill{height:100%;width:0;background:linear-gradient(90deg,#7ea15a,#d7e39a);border-radius:inherit;transition:width .15s linear}
#loader-fill.indeterminate{width:35%;animation:loader-slide 1.1s ease-in-out infinite}
#loader-pct{margin-top:12px;font-size:12px;opacity:.85}
@keyframes loader-slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@media(max-width:650px){#help{display:none}#status{bottom:85px;left:32px;right:auto}}
</style>
</head><body>
<header><small>VEGETATION STUDY / 03</small><h1>Coastal Jungle</h1></header><div id="help">Drag · Scroll · WASD to travel · Shift to move faster</div>
<nav><button id="reset">Reference view</button><button id="alternate">Forest interior</button><button id="overview">Forest overview</button><button id="wind">Wind: on</button></nav>
<div id="status">Loading forest…</div>
<div id="loader"><div class="loader-card"><p>Loading forest…</p><div class="bar"><div id="loader-fill"></div></div><div id="loader-pct">0%</div></div></div>
<script>window.addEventListener('error',e=>{const n=document.querySelector('#loader-pct');if(n)n.textContent='Load failed';const s=document.querySelector('#status');if(s)s.textContent=e.message||'Load failed';});</script>
<script type="module" src="/app.js"></script></body></html>
